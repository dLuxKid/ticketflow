name: Scheduled jobs

# Runs the two maintenance scripts that were previously documented as "cron-triggered
# externally" but had no actual cron anywhere (see gdpr-retention-sweep.js's own comment).
# Both are idempotent (each self-excludes already-processed events), so overlapping or
# re-run schedules are harmless.
#
# Requires repo secrets pointing at the *production* database and mail sender - this
# workflow does nothing useful until DB, GMAIL_EMAIL, GMAIL_PASSWORD (and friends) are
# configured under Settings > Secrets and variables > Actions. Until then it's committed as
# the missing piece, not a claim that it's already wired to prod.

on:
  schedule:
    # GDPR erasure sweep: once a day is enough - the retention window is measured in days.
    - cron: "17 3 * * *"
    # Event-live networking email: every 15 minutes - this one is genuinely time-sensitive
    # ("the moment the event goes live"), unlike GDPR erasure.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  gdpr-sweep:
    name: GDPR retention sweep
    if: github.event.schedule == '17 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        env:
          DB: ${{ secrets.DB }}
        run: npm run gdpr:sweep

  event-live-notify:
    name: Event-live networking email
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        env:
          DB: ${{ secrets.DB }}
          NODE_ENV: production
          PROD_FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GMAIL_HOST: smtp.gmail.com
          GMAIL_PORT: "587"
        run: npm run notify:event-live
