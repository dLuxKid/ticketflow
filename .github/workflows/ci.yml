name: CI

# Runs on every push and PR to main and dev. Two independent jobs: backend lint plus tests
# against a real single-node MongoDB replica set (transactions — used by the atomic
# booking/check-in paths — require one, a standalone mongod throws), and frontend
# typecheck, lint and component tests.

on:
  push:
    # `dev` is where the work actually happens; gating only on `main` meant every change was
    # unverified until merge, which is the moment feedback is least useful.
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Runs before the database is provisioned: linting needs nothing but node_modules, so
      # a lint failure should not cost the time of spinning up a replica set. The backend was
      # previously never linted in CI at all, which is how 76 errors accumulated unnoticed.
      - name: Lint
        working-directory: backend
        run: npm run lint

      # A plain `services:` Mongo container can't be started with --replSet (no custom
      # command support there), so start it directly with docker run and initiate the
      # replica set ourselves — the same requirement documented in
      # IMPLEMENTATION_PROMPT.md's Phase 0 note.
      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 })" && break
            echo "waiting for mongod..."; sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate()"
          for i in $(seq 1 30); do
            STATE=$(docker exec mongo mongosh --quiet --eval "rs.status().myState" 2>/dev/null || echo "")
            [ "$STATE" = "1" ] && echo "replica set is PRIMARY" && break
            echo "waiting for PRIMARY..."; sleep 2
          done

      - name: Run tests (sequential — see note below)
        working-directory: backend
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/ticketflow_ci?replicaSet=rs0
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          JWT_EXPIRES_IN: 7d
        # --test-concurrency=1: Node's test runner executes files concurrently by default.
        # Under the free-tier Atlas cluster used for local development we measured real
        # connection/replication contention from that concurrency (documented in the
        # session history) — forcing sequential execution gave a reliable signal. A local
        # single-node replica set is less contended than shared Atlas, but there's no
        # reason to reintroduce the flakiness risk in CI for a marginal speed gain.
        run: node --test --test-concurrency=1 "tests/**/*.test.js"

      # Measurement only — `continue-on-error` and no threshold. A coverage gate set before
      # the baseline is known either sits low enough to assert nothing or breaks the build on
      # day one. Publish the number first; set a floor under it once it is trusted.
      - name: Coverage (unit)
        working-directory: backend
        continue-on-error: true
        run: npm run test:coverage:lcov

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: ignore

      - name: Stop MongoDB
        if: always()
        run: docker rm -f mongo

  frontend:
    name: Frontend typecheck & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Component tests (Vitest + React Testing Library). Playwright covers whole journeys
      # and needs a running stack; these run headless in seconds and guard rendering logic
      # such as the ticket QR encoding the scannable ticketId.
      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
