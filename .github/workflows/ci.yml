name: CI

# Runs on every push and PR to main and dev. Two independent jobs: backend lint plus tests
# against a real single-node MongoDB replica set (transactions - used by the atomic
# booking/check-in paths - require one, a standalone mongod throws), and frontend
# typecheck, lint and component tests.

on:
  push:
    # `dev` is where the work actually happens; gating only on `main` meant every change was
    # unverified until merge, which is the moment feedback is least useful.
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # Read once at job level so the step-level `if` can test it. A secret cannot be
    # referenced directly in a step `if`, only through env.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Runs before the database is provisioned: linting needs nothing but node_modules, so
      # a lint failure should not cost the time of spinning up a replica set. The backend was
      # previously never linted in CI at all, which is how 76 errors accumulated unnoticed.
      - name: Lint
        working-directory: backend
        run: npm run lint

      # A plain `services:` Mongo container can't be started with --replSet (no custom
      # command support there), so start it directly with docker run and initiate the
      # replica set ourselves - the same requirement documented in
      # IMPLEMENTATION_PROMPT.md's Phase 0 note.
      - name: Start MongoDB as a single-node replica set
        run: |
          set -euo pipefail
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0

          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 })" && break
            echo "waiting for mongod..."; sleep 2
          done

          # The member host MUST be given explicitly.
          #
          # A bare `rs.initiate()` configures the member using the container's own hostname
          # (its Docker ID, e.g. `eba0352e1b6f`). Inside the container that resolves and the
          # set reaches PRIMARY, so every readiness check here passed — but the connection
          # string used by the tests carries `replicaSet=rs0`, which makes the driver perform
          # topology discovery: it reads the replica-set config, learns the member is
          # `eba0352e1b6f:27017`, and tries to resolve THAT from the runner host, where it
          # does not exist. Result: `getaddrinfo EAI_AGAIN <container-id>` on every
          # integration test, while the database itself was perfectly healthy.
          #
          # Pinning 127.0.0.1 makes the advertised address the one the runner can actually
          # reach.
          docker exec mongo mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'

          for i in $(seq 1 30); do
            STATE=$(docker exec mongo mongosh --quiet --eval "rs.status().myState" 2>/dev/null || echo "")
            [ "$STATE" = "1" ] && echo "replica set is PRIMARY" && break
            echo "waiting for PRIMARY..."; sleep 2
          done

          # Fail here, loudly, rather than 60 tests later with a DNS error that looks like a
          # test bug. This asserts the two things the tests actually depend on: the member is
          # advertised as 127.0.0.1, and a client doing replica-set discovery from the runner
          # (exactly what the test connection string does) can complete a write.
          ADVERTISED=$(docker exec mongo mongosh --quiet --eval 'rs.conf().members[0].host')
          echo "replica set advertises: $ADVERTISED"
          case "$ADVERTISED" in
            127.0.0.1:27017) ;;
            *) echo "::error::Replica set advertises '$ADVERTISED', which the runner cannot resolve"; exit 1 ;;
          esac

          docker exec mongo mongosh --quiet \
            "mongodb://127.0.0.1:27017/ci_preflight?replicaSet=rs0" \
            --eval 'db.preflight.insertOne({ok: 1}); print("replica-set discovery OK")'

      - name: Run tests (sequential - see note below)
        working-directory: backend
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/ticketflow_ci?replicaSet=rs0
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          JWT_EXPIRES_IN: 7d
        # --test-concurrency=1: Node's test runner executes files concurrently by default.
        # Under the free-tier Atlas cluster used for local development we measured real
        # connection/replication contention from that concurrency (documented in the
        # session history) - forcing sequential execution gave a reliable signal. A local
        # single-node replica set is less contended than shared Atlas, but there's no
        # reason to reintroduce the flakiness risk in CI for a marginal speed gain.
        run: node --test --test-concurrency=1 "tests/**/*.test.js"

      # Measurement only - `continue-on-error` and no threshold. A coverage gate set before
      # the baseline is known either sits low enough to assert nothing or breaks the build on
      # day one. Publish the number first; set a floor under it once it is trusted.
      - name: Coverage (unit)
        working-directory: backend
        continue-on-error: true
        run: npm run test:coverage:lcov

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: ignore

      # Codecov publishing is OPT-IN on a repository secret, and skipped cleanly when it
      # is absent.
      #
      # The gate is the point: publishing coverage is a report, never something a build
      # should fail on, so an unconfigured integration must be *skipped* (grey) rather than
      # left permanently red for a condition nobody intends to fix. Either way `lcov.info`
      # is still uploaded as a build artifact above, so the data is never lost — only its
      # publication is optional.
      #
      # `flags` keeps the two packages as separate numbers. A merged figure would blend a
      # ~73% backend with a ~2% frontend into something that describes neither.
      #
      # `fail_ci_if_error: false` is explicit rather than relied upon: a Codecov outage must
      # not turn a green test run red.
      - name: Upload backend coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info
          flags: backend
          name: backend
          fail_ci_if_error: false

      - name: Stop MongoDB
        if: always()
        run: docker rm -f mongo

  frontend:
    name: Frontend typecheck & lint
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Component tests (Vitest + React Testing Library). Playwright covers whole journeys
      # and needs a running stack; these run headless in seconds and guard rendering logic
      # such as the ticket QR encoding the scannable ticketId.
      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload frontend coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend
          fail_ci_if_error: false

  # ── Package and publish container images ────────────────────────────────────
  #
  # This is the CD half, and it is deliberately narrow: it *packages and publishes* a
  # versioned artifact to GitHub's Container Registry. It does not deploy - nothing pulls
  # and runs these images automatically, because no hosting target is configured. Calling
  # that out matters: "published to a registry" and "running in production" are different
  # claims, and only the first is true here.
  #
  # Gated on `needs: [backend, frontend]`, so an image is only ever built from a commit whose
  # lint, typecheck and full test suite passed. An image built from a red build is worse than
  # no image: it looks releasable and is not.
  #
  # Runs on pushes to `main` only - never on pull_request. A PR runs code from a fork or a
  # branch that has not been reviewed, and giving that code a token with `packages: write`
  # would let it publish images under this repository's name.
  publish:
    name: Publish container images
    needs: [backend, frontend]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Least privilege: the default GITHUB_TOKEN cannot write packages unless asked, and
      # nothing else in this workflow needs it.
      packages: write

    strategy:
      # Both images are independent; a frontend build failing should not hide a working
      # backend image, and vice versa.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            build-args: ""
          - name: frontend
            context: frontend
            # NEXT_PUBLIC_* values are inlined into the bundle by `next build`, so this URL is
            # baked into the image and cannot be changed at run time. The published frontend
            # image is therefore environment-specific: override this variable per target, or
            # the image will call an API on localhost. The backend image has no such
            # constraint - it reads all configuration from the environment at start-up.
            build-args: |
              NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'http://localhost:4000' }}

    steps:
      - uses: actions/checkout@v7

      # GHCR rejects image names containing uppercase characters, and GitHub owner names are
      # case-preserving (`dLuxKid`). Lowercasing here rather than relying on an action to do
      # it silently keeps the failure mode visible instead of surprising.
      - name: Derive lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` plus the commit SHA. The SHA tag is the one that matters: `latest` is
      # ambiguous the moment two builds exist, so anything reproducible should pin the SHA.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          # Layer cache kept in the same registry, so rebuilds that only change application
          # code do not reinstall dependencies from scratch on every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max
